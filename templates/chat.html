<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ORGpt</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f6f8fb;
      margin: 0;
      padding: 2rem;
    }
    #chatbox {
      width: 70%;
      margin: auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    #messages {
      height: 450px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafafa;
      border-radius: 6px;
      white-space: pre-wrap; /* preserve line breaks */
    }
    .user {
      color: #0056ff;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    .bot {
      color: #222;
      margin-bottom: 1rem;
    }
    pre {
      background: #f0f0f0;
      padding: 0.8rem;
      border-radius: 5px;
      overflow-x: auto;
      font-family: Consolas, monospace;
      font-size: 0.95em;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      background: #0056ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0040c1;
    }
  </style>
</head>

<body>
  <div id="chatbox">
    <h2>Orgpt Chat Interface</h2>
    
    <!-- Status Bar -->
    <div id="status-bar" style="background: #f0fff0; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; border-left: 4px solid #00aa00;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="font-weight: 600;">Active Data Source:</span>
          <span id="active-source" style="margin-left: 1rem; color: #00aa00; font-weight: 600;">📝 Swagger Documentation</span>
        </div>
        <div>
          <label style="margin-right: 0.5rem;">
            <input type="radio" name="mode" value="swagger" checked /> 📝 Swagger
          </label>
          <label>
            <input type="radio" name="mode" value="datadog_poc" /> 📊 Datadog
          </label>
        </div>
      </div>
    </div>

    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="query" name="query" placeholder="Ask Orgpt about any API..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const messages = document.getElementById("messages");
    const queryInput = document.getElementById("query");
    const modeRadios = document.querySelectorAll('input[name="mode"]');

    // Update active source indicator and placeholder based on mode
    modeRadios.forEach(radio => {
      radio.addEventListener("change", (e) => {
        const statusBar = document.getElementById("status-bar");
        const activeSource = document.getElementById("active-source");
        
        if (e.target.value === "datadog_poc") {
          // Datadog mode
          statusBar.style.borderLeft = "4px solid #ff9900";
          statusBar.style.background = "#fff8e6";
          activeSource.style.color = "#ff9900";
          activeSource.innerHTML = "📊 Datadog";
          queryInput.placeholder = "Ask about Datadog services...";
        } else {
          // Swagger mode (default)
          statusBar.style.borderLeft = "4px solid #00aa00";
          statusBar.style.background = "#f0fff0";
          activeSource.style.color = "#00aa00";
          activeSource.innerHTML = "📝 Swagger Documentation";
          queryInput.placeholder = "Ask Orgpt about any API...";
        }
      });
    });

    // Submit form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = queryInput.value;
      if (!query.trim()) return;

      // Display user's message
      messages.innerHTML += `<div class="user"><b>You:</b> ${query}</div>`;
      queryInput.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        // Get selected mode (collection name)
        const collection = document.querySelector('input[name="mode"]:checked').value;
        
        // Use unified /query endpoint with collection parameter
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ 
            query: query,
            collection: collection
          })
        });

        const data = await response.json();
        console.log("📦 Raw response:", data);

        // ✅ Handle both success and error cases
        if (data.answer) {
          // Add source indicator based on collection
          const sourceIcons = {
            "swagger": "📝 Swagger",
            "datadog_poc": "📊 Datadog"
          };
          const source = sourceIcons[collection] || "🔍 OrgGPT";
          const note = data.note ? `<div style="color: #ff9900; font-size: 0.9em; margin-top: 0.5rem;">ℹ️ ${data.note}</div>` : "";
          messages.innerHTML += `<div class="bot"><b>${source}:</b><pre>${data.answer}</pre>${note}</div>`;
        } else if (data.error) {
          messages.innerHTML += `<div class="bot"><b>Error:</b> ${data.error}</div>`;
        } else {
          messages.innerHTML += `<div class="bot"><b>Orgpt:</b> (No valid answer returned)</div>`;
        }

        messages.scrollTop = messages.scrollHeight;
      } catch (err) {
        console.error("❌ Fetch error:", err);
        messages.innerHTML += `<div class="bot"><b>Error:</b> Unable to connect to backend.</div>`;
      }
    });
  </script>
</body>
</html>
