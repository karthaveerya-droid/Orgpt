<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ORGpt</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f6f8fb;
      margin: 0;
      padding: 2rem;
    }
    #chatbox {
      width: 70%;
      margin: auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    #messages {
      height: 450px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafafa;
      border-radius: 6px;
      white-space: pre-wrap; /* preserve line breaks */
    }
    .user {
      color: #0056ff;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    .bot {
      color: #222;
      margin-bottom: 1rem;
    }
    pre {
      background: #f0f0f0;
      padding: 0.8rem;
      border-radius: 5px;
      overflow-x: auto;
      font-family: Consolas, monospace;
      font-size: 0.95em;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      background: #0056ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0040c1;
    }
  </style>
</head>

<body>
  <div id="chatbox">
    <h2>Orgpt Chat Interface</h2>
    
    <!-- Status Bar -->
    <div id="status-bar" style="background: #f0f8ff; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; border-left: 4px solid #0056ff;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="font-weight: 600;">Data Sources:</span>
          <span id="datadog-status" style="margin-left: 1rem; color: #666;">📊 Datadog: <span style="color: #888;">Checking...</span></span>
        </div>
        <div>
          <label style="margin-right: 1rem;">
            <input type="radio" name="mode" value="general" checked /> General
          </label>
          <label>
            <input type="radio" name="mode" value="datadog" /> Datadog Topology
          </label>
        </div>
      </div>
    </div>

    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="query" name="query" placeholder="Ask Orgpt about any API..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const messages = document.getElementById("messages");
    const queryInput = document.getElementById("query");
    const modeRadios = document.querySelectorAll('input[name="mode"]');

    // Check Datadog status on load
    async function checkDatadogStatus() {
      try {
        const response = await fetch("/api/datadog/status");
        const data = await response.json();
        
        if (data.status === "ingested") {
          document.getElementById("datadog-status").innerHTML = 
            `📊 Datadog: <span style="color: #00aa00;">✓ Ready</span> (${data.document_count || '?'} docs)`;
        } else if (data.status === "not_initialized") {
          document.getElementById("datadog-status").innerHTML = 
            `📊 Datadog: <span style="color: #ff9900;">⚠ Not ingested</span> - <a href="#" onclick="ingestDatadog(); return false;" style="color: #0056ff;">Ingest now</a>`;
        }
      } catch (err) {
        document.getElementById("datadog-status").innerHTML = 
          `📊 Datadog: <span style="color: #999;">⊗ Unavailable</span>`;
      }
    }

    // Ingest Datadog data
    async function ingestDatadog() {
      const statusEl = document.getElementById("datadog-status");
      statusEl.innerHTML = `📊 Datadog: <span style="color: #0056ff;">⟳ Ingesting...</span>`;
      
      try {
        const response = await fetch("/api/datadog/ingest", { method: "POST" });
        const data = await response.json();
        
        if (data.status === "success") {
          statusEl.innerHTML = 
            `📊 Datadog: <span style="color: #00aa00;">✓ Ready</span> (${data.document_count} docs)`;
          alert(`✓ Ingested ${data.document_count} Datadog documents!`);
        } else {
          statusEl.innerHTML = 
            `📊 Datadog: <span style="color: #ff0000;">✗ Failed</span>`;
          alert(`Error: ${data.error}`);
        }
      } catch (err) {
        statusEl.innerHTML = 
          `📊 Datadog: <span style="color: #ff0000;">✗ Error</span>`;
        alert(`Connection error: ${err.message}`);
      }
    }

    // Update placeholder based on mode
    modeRadios.forEach(radio => {
      radio.addEventListener("change", (e) => {
        if (e.target.value === "datadog") {
          queryInput.placeholder = "Ask about service dependencies, SLOs, ownership...";
        } else {
          queryInput.placeholder = "Ask Orgpt about any API...";
        }
      });
    });

    // Submit form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = queryInput.value;
      if (!query.trim()) return;

      // Display user's message
      messages.innerHTML += `<div class="user"><b>You:</b> ${query}</div>`;
      queryInput.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        // Get selected mode
        const mode = document.querySelector('input[name="mode"]:checked').value;
        
        // Choose endpoint
        const endpoint = mode === "datadog" ? "/chat/datadog-specific" : "/chat";

        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ query })
        });

        const data = await response.json();
        console.log("📦 Raw response:", data);

        // ✅ Handle both success and error cases
        if (data.answer) {
          // Add source indicator
          const source = mode === "datadog" ? "📊 Datadog" : "🔍 OrgGPT";
          messages.innerHTML += `<div class="bot"><b>${source}:</b><pre>${data.answer}</pre></div>`;
        } else if (data.error) {
          messages.innerHTML += `<div class="bot"><b>Error:</b> ${data.error}</div>`;
        } else {
          messages.innerHTML += `<div class="bot"><b>Orgpt:</b> (No valid answer returned)</div>`;
        }

        messages.scrollTop = messages.scrollHeight;
      } catch (err) {
        console.error("❌ Fetch error:", err);
        messages.innerHTML += `<div class="bot"><b>Error:</b> Unable to connect to backend.</div>`;
      }
    });

    // Check status on page load
    checkDatadogStatus();
    
    // Refresh status every 30 seconds
    setInterval(checkDatadogStatus, 30000);
  </script>
</body>
</html>
