<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OrgGPT</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f6f8fb;
      margin: 0;
      padding: 2rem;
    }
    #chatbox {
      width: 70%;
      margin: auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    #messages {
      height: 450px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafafa;
      border-radius: 6px;
      white-space: pre-wrap; /* preserve line breaks */
    }
    .user {
      color: #0056ff;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }
    .bot {
      color: #222;
      margin-bottom: 1rem;
    }
    pre {
      background: #f0f0f0;
      padding: 0.8rem;
      border-radius: 5px;
      overflow-x: auto;
      font-family: Consolas, monospace;
      font-size: 0.95em;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      background: #0056ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0040c1;
    }
    .status-bar {
      background: #e8f4fd;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      border-left: 4px solid #0056ff;
    }
    .recommended {
      background: #d4edda;
      border-color: #28a745;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
      color: #155724;
    }
  </style>
</head>

<body>
  <div id="chatbox">
    <h2>🔍 OrgGPT</h2>
    
    <!-- Status Bar -->
    <div class="status-bar" id="status-bar">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="font-weight: 600;">Data Source:</span>
          <span id="active-source" style="margin-left: 1rem; color: #0056ff; font-weight: 600;">
          </span>
          <span class="recommended" id="recommended-badge">All Sources</span>
        </div>
      </div>
      <div style="margin-top: 0.5rem; color: #666; font-size: 0.9em;">
        Swagger API Documentation + Datadog Catalog + Datadog SLOs
      </div>
    </div>

    <div id="messages"></div>

    <form id="chat-form">
      <input type="text" id="query" name="query" placeholder="Ask about APIs, Datadog services, SLOs, or anything..." required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const messages = document.getElementById("messages");
    const queryInput = document.getElementById("query");

    // Submit form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = queryInput.value;
      if (!query.trim()) return;

      // Display user's message
      messages.innerHTML += `<div class="user"><b>You:</b> ${query}</div>`;
      queryInput.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        // Query unified endpoint (always uses unified_knowledge)
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ 
            query: query
          })
        });

        const data = await response.json();
        console.log("📦 Response:", data);

        // Handle response
        if (data.answer) {
          const sourceIcon = data.source_icon || "🔍";
          const sourceName = data.source_name || data.source;
          const note = data.note ? `<div style="color: #666; font-size: 0.9em; margin-top: 0.5rem;">ℹ️ ${data.note}</div>` : "";
          messages.innerHTML += `<div class="bot"><b>${sourceIcon} ${sourceName}:</b><pre>${data.answer}</pre>${note}</div>`;
        } else if (data.error) {
          messages.innerHTML += `<div class="bot"><b>❌ Error:</b> ${data.error}</div>`;
        } else {
          messages.innerHTML += `<div class="bot"><b>⚠️ Warning:</b> No answer returned</div>`;
        }

        messages.scrollTop = messages.scrollHeight;
      } catch (err) {
        console.error("❌ Fetch error:", err);
        messages.innerHTML += `<div class="bot"><b>❌ Error:</b> Unable to connect to backend.</div>`;
        messages.scrollTop = messages.scrollHeight;
      }
    });
  </script>
</body>
</html>
